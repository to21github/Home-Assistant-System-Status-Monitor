name: "系统状态监控"
version: "1.0.0"
slug: "system_status_monitor"
image: ghcr.io/to21github/system-status-monitor
description: "实时监控 Home Assistant 系统健康状态的 Web 仪表盘"
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:heart-pulse
panel_title: 系统状态
panel_admin: false
hassio_api: true
homeassistant_api: true
init: false
# healthcheck 在容器内执行（slim 镜像无 wget，用 python3 探测只读端点 /api/stats）
healthcheck: python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/stats', timeout=5)"
# watchdog 由 Supervisor 发起 HTTP GET 探测，必须为 URL 格式，[HOST] 会替换为插件容器地址
watchdog: http://[HOST]:8099/api/stats
options:
  refresh_interval: 30
schema:
  refresh_interval: int(5,300)
